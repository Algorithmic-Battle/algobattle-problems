name: Code Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint with Ruff
        run: uv run ruff check .\algobattle_problems\

  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: uv sync --locked
      - name: Test with unittest
        run: uv run python -m unittest discover -v -s algobattle_problems -p tests.py
